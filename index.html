<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | System Update</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #d4d4d4;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .maintenance-container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #222, #111);
            border: 1px solid #333;
            border-radius: 20px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .logo-placeholder svg {
            width: 40px;
            fill: #444;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #eee;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        p {
            line-height: 1.6;
            color: #888;
            margin-bottom: 2rem;
        }
        .loader {
            width: 40px;
            height: 4px;
            background: #1a1a1a;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }
        .loader::after {
            content: '';
            position: absolute;
            left: -50%;
            height: 100%;
            width: 50%;
            background: #333;
            animation: loading 2s infinite linear;
        }
        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }
        .status-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #555;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="logo-placeholder">
            <svg viewBox="0 0 24 24"><path d="M12,18c-3.31,0-6-2.69-6-6s2.69-6,6-6s6,2.69,6,6S15.31,18,12,18z M12,8c-2.21,0-4,1.79-4,4s1.79,4,4,4s4-1.79,4-4 S14.21,8,12,8z M12,20c-4.41,0-8-3.59-8-8s3.59-8,8-8s8,3.59,8,8S16.41,20,12,20z M12,4c-4.41,0-8,3.59-8,8s3.59,8,8,8s8-3.59,8-8 S16.41,4,12,4z"/></svg>
        </div>
        <h1>System Maintenance</h1>
        <p>Our infrastructure is currently undergoing scheduled updates to improve performance and security. We expect to be back online shortly.</p>
        <div class="loader"></div>
        <div class="status-tag">CORE_SYSTEM_OFFLINE // V2.0.4</div>
    </div>

    <!-- 
        Hidden data interface for authorized applications.
        Do not remove this script; it serves as the backend response bridge.
    -->
    <script>
        // Dormant verification logic - only responds to internal system calls
        window.__INTERNAL_SYS = {
            verify: async function(k) {
                try {
                    const r = await fetch('keys.json');
                    const d = await r.json();
                    return d.keys.find(i => i.key === k) || null;
                } catch(e) { return null; }
            }
        };
        console.log("System Status: Operational (Standby Mode)");
    </script>
</body>
</html>
